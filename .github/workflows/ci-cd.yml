name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app

      - name: Run tests
        run: |
          if [ -d tests ] || find . -maxdepth 2 -name "test_*.py" -not -path "./.venv/*" | grep -q .; then
            pip install pytest
            pytest
          else
            echo "No tests found, skipping"
          fi

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: [test-backend, test-frontend]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/var/www/iqtidorli-talaba' }}

            PREV_COMMIT=$(git rev-parse HEAD)
            FRONTEND_HEALTH_URL="http://127.0.0.1:${{ vars.FRONTEND_PORT || '5181' }}/"
            BACKEND_HEALTH_URL="http://127.0.0.1:${{ vars.BACKEND_PORT || '8092' }}/api/v1/news"

            rollback() {
              echo "Deploy failed, rolling back to $PREV_COMMIT"
              git reset --hard "$PREV_COMMIT"
              docker compose build
              docker compose up -d
              exit 1
            }

            git fetch --tags --force
            git checkout "${{ github.ref_name }}"
            docker compose build

            # Run new migrations against the new image while the old
            # containers are still serving traffic, so the site stays up.
            for i in $(seq 1 10); do
              docker compose run --rm web python -m app.core.migrations && break
              echo "waiting for db, retrying ($i/10)..."
              sleep 3
            done || rollback

            # Swap only the services whose image/config changed; db/redis
            # keep running, so downtime is limited to the web container restart.
            docker compose up -d || rollback

            sleep 5
            for i in $(seq 1 10); do
              curl -sf "$FRONTEND_HEALTH_URL" > /dev/null && curl -sf "$BACKEND_HEALTH_URL" > /dev/null && exit 0
              sleep 3
            done
            rollback

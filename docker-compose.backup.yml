# Nizom 26-modda: kunlik avtomatik zaxira nusxa (pg_dump, 14 kun saqlanadi).
# Ishga tushirish:
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d db-backup
# yoki serverda .env ga: COMPOSE_FILE=docker-compose.yml:docker-compose.backup.yml
# Bir martalik nusxa:
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml run --rm -e BACKUP_RUN_ONCE=1 db-backup
services:
  db-backup:
    image: postgres:16-alpine
    container_name: iqtidorli_db_backup
    restart: always
    entrypoint: ["/bin/sh", "/scripts/db_backup.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-talaba_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-talaba_pass_2026}
      PGDATABASE: ${POSTGRES_DB:-iqtidorli_db}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: Asia/Tashkent
    volumes:
      - ./scripts/db_backup.sh:/scripts/db_backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

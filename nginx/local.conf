# Faqat lokal ishlab chiqish uchun (docker compose --profile local).
# Lokalda ilova ildizda ishlaydi (.env: APP_BASE_PATH= bo'sh): http://lvh.me:8088/login
# — HEMIS OAuth'da ro'yxatdan o'tgan qaytish manzili ham aynan shu.
server {
    listen 80;
    server_name _;
    client_max_body_size 25M;
    absolute_redirect off;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $http_host;
    }
}

# Frontend konteyneri ichidagi nginx.
# Host nginx /iqtidorli-talaba/ prefiksini kesib yuboradi, shuning uchun bu yerda
# so'rovlar ildizdan keladi: /assets/..., /login, /dashboard ...
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite build fayllari nomida hash bor -> uzoq kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA: mavjud bo'lmagan yo'llar index.html ga (React Router hal qiladi).
    # index.html keshlanmaydi - yangi deploydan keyin darhol yangi versiya ochiladi.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

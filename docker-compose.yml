# Production: jbnuu.uz/iqtidorli-talaba
#   frontend -> 127.0.0.1:5179   (host nginx: /iqtidorli-talaba/)
#   backend  -> 127.0.0.1:8092   (host nginx: /iqtidorli-talaba/api/ va /iqtidorli-talaba/static/)
# Portlar faqat 127.0.0.1 ga ochiladi - tashqaridan faqat host nginx orqali kiriladi.
# Barcha sirlar .env faylidan olinadi (.env.example ga qarang).

services:
  db:
    image: postgres:16-alpine
    container_name: iqtidorli_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env da berilishi shart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi shart}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env da berilishi shart}
      TZ: Asia/Tashkent
    # Tashqi port ochilmaydi. Hostdan psql kerak bo'lsa:
    #   docker compose exec db psql -U "$POSTGRES_USER" "$POSTGRES_DB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: iqtidorli_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: iqtidorli_web:latest
    container_name: iqtidorli_fastapi
    restart: always
    env_file: .env
    environment:
      IN_DOCKER: "1"
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # uvicorn --root-path: Swagger, OpenAPI servers va redirect URL lari subpath bilan chiqadi
      UVICORN_ROOT_PATH: ${APP_BASE_PATH-/iqtidorli-talaba}
      COOKIE_PATH: ${APP_BASE_PATH-/iqtidorli-talaba}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ: Asia/Tashkent
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8092}:8000"
    volumes:
      # Yuklangan fayllar (yutuqlar, yangiliklar rasmlari, hujjatlar) konteyner
      # qayta qurilganda yo'qolmasligi uchun
      - uploads_data:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: ${APP_BASE_PATH-/iqtidorli-talaba}/
    image: iqtidorli_frontend:latest
    container_name: iqtidorli_frontend
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5179}:80"
    depends_on:
      - web

  # Faqat lokal: serverda host nginx bor. .env da COMPOSE_PROFILES=local bo'lsa ishga tushadi.
  nginx:
    image: nginx:1.27-alpine
    container_name: iqtidorli_nginx
    restart: unless-stopped
    profiles: ["local"]
    ports:
      - "127.0.0.1:${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
